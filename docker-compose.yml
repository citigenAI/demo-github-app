services:
  redis:
    image: redis:7-alpine
    container_name: swara-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: swara-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: swara
      MINIO_ROOT_PASSWORD: swara_dev_secret
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: swara-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 swara swara_dev_secret &&
      mc mb --ignore-existing local/swara-magical &&
      mc anonymous set none local/swara-magical
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: swara-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  miniodata:
